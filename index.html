<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nascent Destiny | Раскидки игроков</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Фишечные раскидки</h1>
            <p>Выбери карту и тип гранаты</p>
        </header>

        <div class="categories">
            <div class="cat-group">
                <span class="cat-label">🗺️ КАРТА</span>
                <div class="select-wrapper" id="map-select-wrapper">
                    <select id="map-select" class="cat-select">
                        <option value="mirage" data-icon="img/icon/mirage_icon.png">Mirage</option>
                        <option value="dust2" data-icon="img/icon/dust_icon.png">Dust II</option>
                        <option value="anubis" data-icon="img/icon/anubis_icon.png">Anubis</option>
                        <option value="ancient" data-icon="img/icon/ancient_icon.png">Ancient</option>
                        <option value="overpass" data-icon="img/icon/overpass_icon.png">Overpass</option>
                        <option value="nuke" data-icon="img/icon/nuke_icon.png">Nuke</option>
                        <option value="inferno" data-icon="img/icon/inferno_icon.png">Inferno</option>
                        <option value="train" data-icon="img/icon/train_icon.png">Train</option>
                        <option value="vertigo" data-icon="img/icon/vertigo_icon.png">Vertigo</option>
                        <option value="cache" data-icon="img/icon/cache_icon.png">Cache</option>
                    </select>
                </div>
                <span class="cat-label">💣 ГРАНАТА</span>
                <div class="select-wrapper" id="grenade-select-wrapper">
                    <select id="grenade-select" class="cat-select">
                        <option value="smoke">💨 Smoke (Дым)</option>
                        <option value="flash">⚡ Flashbang (Флешка)</option>
                        <option value="molotov">🔥 Molotov (Молик)</option>
                        <option value="he">💥 HE (Осколочная)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="positions-pagination" id="positions-pagination" style="display: none;">
            <div class="pagination-tabs" id="pagination-tabs" style="display: none;">
                <button class="pagination-tab active" data-tab="regular">Обычные</button>
                <button class="pagination-tab" data-tab="instant">Instant (Инста)</button>
            </div>
            
            <div class="pagination-header">
                <span class="pagination-label">📌 РАСКИДКИ</span>
                <span class="pagination-counter" id="pagination-counter">0 раскидок</span>
            </div>
            
            <div class="pagination-buttons" id="pagination-buttons">
            </div>
        </div>

        <div class="content-wrapper">
            <iframe id="page-frame""></iframe>
        </div>
    </div>
</body>
</html>
